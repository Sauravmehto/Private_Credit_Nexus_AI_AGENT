# Render Blueprint — see https://render.com/docs/blueprint-spec
# After push: use this file in the Render dashboard (New → Blueprint) or connect the repo.
services:
  - type: web
    name: private-credit-mcp
    runtime: python
    plan: free
    # Do not set PORT here — Render injects it. The app reads PORT and binds 0.0.0.0.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install .
    startCommand: python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      - key: LOG_LEVEL
        value: info
      - key: CORS_ALLOW_ORIGINS
        value: "*"
